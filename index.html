<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Green belts, walks and bike rides across Dubai Hills Estate, with shade ratings.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubai Hills walking map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="leaflet.css">
<style>
/* VOICE: a neighbour's field guide to Dubai Hills, calm and plain.
   IDEA: a park ranger's trail map, the map is the page and a guide card slides over it.
   PICTURE: full-bleed satellite map, glowing green trails, numbered trail markers.
   COLOUR and TYPE: deep forest chrome, leaf green, warm sand, sky and pink for routes; Figtree.
   LAYOUT: phone = map full screen with a bottom sheet; desktop = guide panel left, map right. */
:root{color-scheme:light;
--bg:light-dark(#f4f1ea,#0c1410);--panel:light-dark(#fbfaf6,#111b15);--card:light-dark(#fff,#16231b);--ink:light-dark(#16221b,#e8efe9);--mut:light-dark(#5b6a61,#93a69a);--line:light-dark(#e3ded2,#22342a);
--leaf:#3ee07a;--leafd:light-dark(#178a45,#3ee07a);--sand:light-dark(#efe6d3,#2a2a20);--sky:#4cc6ff;--sun:#ffc93c;--pink:#ff5fd2;--bike:#3b8bff;--home:#ff9b3d;--sh:0 10px 30px rgba(10,20,14,.18)}
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:light}
html:root.dark{color-scheme:dark;--bg:#121315;--panel:#17181b;--card:#202125;--ink:#ececea;--mut:#a3a5a9;--line:#2e3034;--leafd:#4ade80;--sand:#26272b;--sh:0 10px 30px rgba(0,0,0,.5)}
html.dark .s2{color:#ffd36a}html.dark .s1{color:#ff9f73}
html.dark .leaflet-control-attribution{background:rgba(20,21,24,.75)!important;color:#aaa}html.dark .leaflet-control-attribution a{color:#ccc}
.ic-sun{display:none}html.dark .ic-sun{display:block}html.dark .ic-moon{display:none}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;min-height:560px}
body{position:relative}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.app{position:absolute;inset:0;min-height:560px;display:grid;grid-template-columns:var(--pw,400px) 10px minmax(0,1fr)}
.split{background:var(--panel);border-right:1px solid var(--line);cursor:col-resize;display:grid;place-items:center;touch-action:none;z-index:3}
.split::after{content:'';width:4px;height:44px;border-radius:2px;background:var(--line);transition:background .15s}
.split:hover::after,.split.on::after{background:var(--leafd)}
.lrow{display:flex;gap:6px}
.ic-off{display:none}body.fs .ic-on{display:none}body.fs .ic-off{display:block}
body.fs .app{grid-template-columns:minmax(0,1fr)}
body.fs .panel,body.fs .split{display:none!important}
.fstabs{display:none;position:absolute;z-index:500;left:12px;bottom:24px;max-width:calc(100% - 170px);gap:4px;padding:5px;border-radius:999px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);box-shadow:var(--sh);overflow-x:auto;scrollbar-width:none}
.fstabs::-webkit-scrollbar{display:none}
body.fs .fstabs{display:flex}
body.dragging{cursor:col-resize;user-select:none}

#map{position:relative;height:100%;background:#f2efe7;z-index:0}
.seg{display:flex;gap:4px;padding:4px;margin:2px 2px 6px;background:var(--sand);border-radius:10px}
.seg button{flex:1;min-height:36px;border:0;border-radius:8px;background:transparent;font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;z-index:2}
.head{padding:20px 22px 12px}
h1{font-size:30px;line-height:1.05;margin:0 0 6px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--mut);margin:0;font-size:15px}
.tabs{display:flex;gap:4px;padding:0 18px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
@media(min-width:821px){.tabs{flex-wrap:wrap;overflow:visible}}
.tab{flex:none;border:0;background:transparent;padding:0 13px;min-height:38px;border-radius:999px;font-weight:600;font-size:15px;color:var(--mut);cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:var(--panel)}
.scroll{overflow-y:auto;padding:4px 16px 24px;flex:1;overscroll-behavior:contain}
.note{font-size:14px;color:var(--mut);background:var(--sand);border-radius:10px;padding:9px 12px;margin:4px 2px 10px}
.item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.item:hover{border-color:var(--leafd)}
.item[aria-pressed=true]{border-color:var(--leafd);box-shadow:0 0 0 2px color-mix(in srgb,var(--leaf) 45%,transparent)}
.k{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0b1a10;background:var(--leaf);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.item b{display:block;font-size:16.5px;line-height:1.25;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:3px 0 4px;font-size:13.5px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.d{font-size:14.5px;color:var(--mut);display:block}
.shade{display:inline-flex;align-items:center;gap:5px;font-weight:600;font-size:12.5px;padding:2px 8px 2px 6px;border-radius:999px;white-space:nowrap}
.shade svg{width:13px;height:13px}
.s3{background:color-mix(in srgb,#2fbf6b 18%,transparent);color:var(--leafd)}
.s2{background:color-mix(in srgb,#e0b63a 22%,transparent);color:light-dark(#8a6400,#ffd36a)}
.s1{background:color-mix(in srgb,#e8743b 20%,transparent);color:light-dark(#a6421a,#ff9f73)}
.foot{font-size:12.5px;color:var(--mut);padding:12px 4px 0;line-height:1.45}
/* map chrome */
.layers{position:absolute;z-index:500;top:12px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lbtn{border:0;min-height:40px;padding:0 14px;border-radius:999px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);box-shadow:var(--sh);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.lmenu{display:none;flex-direction:column;gap:2px;background:var(--panel);border-radius:14px;box-shadow:var(--sh);padding:6px;min-width:210px}
.lmenu.open{display:flex}
.lmenu label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:15px}
.lmenu label:hover{background:var(--sand)}
.lmenu input{width:18px;height:18px;accent-color:#178a45}
.sw{width:22px;height:6px;border-radius:3px;flex:none}
.home{position:absolute;z-index:500;bottom:24px;right:12px}
.leaflet-container{font-family:Figtree,sans-serif}
.leaflet-control-zoom{border:0!important;box-shadow:var(--sh)!important;border-radius:12px!important;overflow:hidden}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important;width:38px!important;height:38px!important;line-height:38px!important}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.7)!important}
.pin{width:28px!important;height:28px!important;margin:-14px 0 0 -14px!important;border-radius:50%;display:grid;place-items:center;font:800 13px Figtree,sans-serif;color:#0b1a10;background:var(--leaf);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform .15s}
.pin.a{background:var(--sky)}.pin.b{background:var(--sun)}.pin.c{background:var(--pink)}.pin.d{background:var(--bike);color:#fff}
.pin.on{transform:scale(1.25);z-index:999!important}
.lbl{background:rgba(8,14,10,.68)!important;color:#fff!important;border:0!important;box-shadow:none!important;font:700 12.5px Figtree,sans-serif!important;padding:2px 9px!important;border-radius:999px!important;letter-spacing:.01em}
.lbl::before,.poi::before{display:none}
.poi{background:rgba(255,255,255,.94)!important;color:#16221b!important;border:0!important;font:600 11.5px Figtree,sans-serif!important;padding:1px 7px!important;border-radius:999px!important;box-shadow:0 1px 3px rgba(0,0,0,.45)!important}
.dot{width:9px!important;height:9px!important;margin:-4.5px 0 0 -4.5px!important;border-radius:50%;background:#fff;border:2px solid #16221b}
.htip{font:600 12px Figtree,sans-serif}
/* detail card */
.detail{display:none}
.handle{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--mut);padding:0 22px 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
@media(max-width:820px){
 .app{grid-template-columns:1fr}
 #map{position:absolute;inset:0}
 .panel{position:absolute;left:0;right:0;bottom:0;height:min(52vh,460px);border-right:0;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);transition:height .28s cubic-bezier(.2,.8,.2,1)}
 .panel.min{height:auto}
 .panel.min .head,.panel.min .tabs,.panel.min .scroll,.panel.min .legend{display:none}
 .panel.min .detail{display:block}
 .panel.peek{height:auto}
 .panel.peek .head,.panel.peek .legend,.panel.peek .scroll{display:none}
 .panel.peek .tabs{padding-bottom:14px}
 .panel.max{height:88vh}
 .handle{display:block;width:100%;border:0;background:transparent;padding:10px 0 6px;cursor:ns-resize;touch-action:none}
 .split{display:none}
 .panel.drag{transition:none}
 body.fs .fstabs{left:10px;right:10px;max-width:none;bottom:18px}
 .lrow .lbtn span{display:none}
 .handle i{display:block;width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
 .head{padding:4px 18px 8px}
 h1{font-size:23px}
 .sub{font-size:14px}
 .legend{padding:0 18px 8px}
 .layers{top:10px;right:10px}
 .home{bottom:auto;top:10px;left:10px;right:auto}
 .leaflet-top.leaflet-left{top:56px}
}
.detail{padding:6px 18px 16px}
.dtop{display:flex;gap:12px;align-items:flex-start}
.dtop b{font-size:19px;line-height:1.2;display:block}
.dnav{display:flex;gap:8px;margin-top:12px}
.dnav button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.dnav .list{flex:1.3;background:var(--ink);color:var(--panel);border-color:var(--ink)}
.why{display:block;font-size:15px;color:var(--ink);margin:2px 0 3px;line-height:1.4}
.item .d,.detail .d{font-size:14px}
.fold{display:none}
.syn .leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:16px;box-shadow:var(--sh)}
.syn .leaflet-popup-tip{background:var(--panel)}
.syn .leaflet-popup-content{margin:14px 16px;font:15px/1.45 Figtree,sans-serif}
.syn a.leaflet-popup-close-button{color:var(--mut);width:32px;height:32px;font-size:22px;line-height:30px}
.ptop{display:flex;gap:10px;align-items:center;padding-right:18px}
.ptop .k{width:28px;height:28px;font-size:13px;flex:none}
.ptop b{font-size:17px;line-height:1.2}
.syn .meta{margin:8px 0 6px}
.pwhy{margin:0 0 6px;font-weight:600;font-size:15.5px}
.pd{margin:0 0 10px;color:var(--mut);font-size:14px}
.pzoom{width:100%;min-height:40px;border-radius:10px;border:0;background:var(--ink);color:var(--panel);font-weight:600;cursor:pointer}
@media(max-width:820px){
 .fold{display:flex;gap:6px;position:absolute;top:8px;right:12px;z-index:3}
 .fold button{width:40px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
 .fold button svg{width:20px;height:20px}
 .fold button:disabled{opacity:.3;cursor:default}
 .panel{position:absolute}
 .head{padding-right:110px}
 .panel.peek .tabs{margin-top:34px}
 .panel.peek .handle{position:absolute;top:0;left:0;right:0}
 .dtop .k,.ptop .k{flex:none}
 .panel.min .detail{padding-top:14px}
 .panel.min .dtop{padding-right:96px}
}
.ic{width:26px!important;height:26px!important;margin:-13px 0 0 -13px!important;border-radius:8px;display:grid;place-items:center;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.ic svg{width:15px;height:15px}
.ic.pool{background:#1e9bd7}.ic.court{background:#e07b1a}.ic.play{background:#d9467a}.ic.food{background:#7a4a24;border-radius:50%}
.ic.big{width:34px!important;height:34px!important;margin:-17px 0 0 -17px!important}.ic.big svg{width:19px;height:19px}
.ic.on{transform:scale(1.2);box-shadow:0 0 0 4px rgba(255,255,255,.7),0 2px 8px rgba(0,0,0,.5)}
.sec{font-size:13px;font-weight:700;color:var(--mut);margin:14px 4px 8px;letter-spacing:.02em}
.k.f{background:#7a4a24;color:#fff;border-radius:50%}.k.p{background:#1e9bd7;color:#fff;border-radius:9px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.tags span{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sand)}
@media(prefers-reduced-motion:reduce){.panel,.pin,.item{transition:none}}
</style>
</head>
<body>
<div class="app">
 <aside class="panel" id="panel" aria-label="Trail guide">
  <button class="handle" id="handle" aria-label="Show more or less of the list"><i></i></button>
  <div class="fold"><button id="fup" aria-label="Fold the list up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg></button><button id="fdown" aria-label="Fold the list down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div>
  <div class="head">
   <h1>Dubai Hills on foot and by bike</h1>
   <p class="sub">The best green belts, walks and rides, with how shady each one is.</p>
  </div>
  <div class="legend">
   <span><svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="#3ee07a"/></svg>Trail</span>
   <span><i class="sw" style="background:repeating-linear-gradient(90deg,#4cc6ff 0 6px,transparent 6px 10px)"></i>Walk loop</span>
   <span><i class="sw" style="background:repeating-linear-gradient(90deg,#ff5fd2 0 6px,transparent 6px 10px)"></i>Ride</span>
   <span><i class="sw" style="background:#4dbb73;height:2px"></i>Other paths</span>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="scroll" id="list"></div>
  <div class="detail" id="detail"></div>
 </aside>
 <div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="Drag to resize the list and the map" tabindex="0"></div>
 <div style="position:relative;min-height:0">
  <div id="map" role="region" aria-label="Map of Dubai Hills Estate"></div>
  <div class="layers">
   <div class="lrow"><button class="lbtn" id="mode" aria-pressed="false" aria-label="Dark mode"><svg class="ic-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg><svg class="ic-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button class="lbtn" id="fs" aria-pressed="false" aria-label="Full screen map"><svg class="ic-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="ic-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg><span>Full screen</span></button>
   <button class="lbtn" id="lbtn" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg>Layers</button></div>
   <div class="lmenu" id="lmenu">
    <div class="seg" role="group" aria-label="Map style"><button data-base="plain" aria-pressed="true">Plain map</button><button data-base="sat" aria-pressed="false">Satellite</button></div>
    <label><input type="checkbox" data-l="green" checked><i class="sw" style="background:#4dbb73;height:3px"></i>All off-road paths</label>
    <label><input type="checkbox" data-l="hi" checked><i class="sw" style="background:#3ee07a"></i>Trails</label>
    <label><input type="checkbox" data-l="loops" checked><i class="sw" style="background:#4cc6ff"></i>Walk loops</label>
    <label><input type="checkbox" data-l="bike" checked><i class="sw" style="background:#ff5fd2"></i>Rides</label>
    <label><input type="checkbox" data-l="fac" checked><i class="sw" style="background:#1e9bd7"></i>Pools, courts &amp; play</label>
    <label><input type="checkbox" data-l="food" checked><i class="sw" style="background:#7a4a24"></i>Food &amp; coffee</label>
    <label><input type="checkbox" data-l="homes"><i class="sw" style="background:#ff9b3d"></i>Maple homes on a belt</label>
   </div>
  </div>
  <button class="lbtn home" id="reset">Whole estate</button>
  <div class="fstabs" id="fstabs" role="tablist" aria-label="Jump to an area"></div>
 </div>
</div>
<script src="leaflet.js"></script>

  detail.innerHTML=`<div class="dtop"><span class="k" style="${st}">${id}</span><span><b>${it.t}</b><span class="meta">${it.lenTxt?`<span>${it.lenTxt}</span>`:''}${shade(it.sh)}</span><span class="why">${it.why}</span><span class="d">${it.d}</span></span></div><div class="dnav"><button data-go="${order[(i-1+order.length)%order.length]}" aria-label="Previous">← Prev</button><button class="list" data-list>All in ${it.grp.name}</button><button data-go="${order[(i+1)%order.length]}" aria-label="Next">Next →</button></div>`;
  if(mob()){setSheet('min',true);}else list.querySelector(`[data-id="${id}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'});
  requestAnimationFrame(()=>{map.flyToBounds(r.bnds,{...pad(),maxZoom:17.5,duration:.8});if(!mob())map.once('moveend',()=>{if(cur===id)pop(id)})});
 }
 function pop(id,mk){
  const r=reg[id];quiet=true;map.closePopup();quiet=false;cur=id;if(r.it.grp.id!==curG)showG(r.it.grp.id);
  document.querySelectorAll('.item').forEach(x=>x.setAttribute('aria-pressed',x.dataset.id===id));
  dim(true);r.gs.forEach(g=>g.eachLayer(l=>l.bringToFront&&l.bringToFront()));
  mk=mk||r.pins[0];const it=r.it,st=it.c?`background:${cols[it.c]};${it.c==='d'?'color:#fff':''}`:'';
  const h=isFs()?70:mob()?panel.offsetHeight:0;
  L.popup({className:'syn',maxWidth:290,minWidth:240,offset:[0,-12],autoPanPaddingTopLeft:[60,64],autoPanPaddingBottomRight:[16,h+16]})
   .setLatLng(mk.getLatLng()).setContent(`<div class="ptop"><span class="k" style="${st}">${id}</span><b>${it.t}</b></div><div class="meta">${it.lenTxt?`<span>${it.lenTxt}</span>`:''}${shade(it.sh)}</div><p class="pwhy">${it.why}</p><p class="pd">${it.d}</p><button class="pzoom" data-z="${id}">Zoom to it</button>`).openOn(map);
 }
 let quiet=false;
 map.on('popupclose',()=>{if(quiet||!cur||panel.classList.contains('min'))return;cur=null;dim(false);document.querySelectorAll('.item[aria-pressed=true]').forEach(x=>x.setAttribute('aria-pressed','false'))});
 document.getElementById('map').addEventListener('click',e=>{const z=e.target.closest('.pzoom');if(z){e.stopPropagation();select(z.dataset.z)}});
 detail.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)return select(g.dataset.go);if(e.target.closest('[data-list]')){clearSel();setSheet('mid')}});
 // sheet
 const setSheet=(s,keep)=>{panel.style.height='';const was=panel.className;['min','max','peek'].forEach(c=>panel.classList.toggle(c,s===c));if(keep||was===panel.className)return;setTimeout(()=>{map.invalidateSize();if(s==='max')return;if(!cur)map.closePopup();cur&&reg[cur]?map.flyToBounds(reg[cur].bnds,{...pad(),maxZoom:17.5,duration:.5}):map.flyToBounds(G.find(x=>x.id===curG).bounds,{...pad(),duration:.5})},300)};
 document.getElementById('handle').onclick=()=>{if(dragged){dragged=false;return}const c=panel.classList;if(c.contains('min')){clearSel();setSheet('mid')}else if(c.contains('max')||c.contains('peek'))setSheet('mid');else setSheet('peek')};
 let sy=null;panel.querySelector('.head').addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});
 panel.querySelector('.head').addEventListener('touchend',e=>{if(sy==null)return;const dy=e.changedTouches[0].clientY-sy;sy=null;if(dy>40)setSheet(panel.classList.contains('max')?'mid':'peek');if(dy<-40)setSheet('max')},{passive:true});
 window.setSheet=setSheet;
 window.refocus=()=>{map.invalidateSize();if(mob()&&!isFs()&&innerHeight-panel.offsetHeight<240)return;cur&&reg[cur]?map.flyToBounds(reg[cur].bnds,{...pad(),maxZoom:17.5,duration:.5}):map.flyToBounds(G.find(x=>x.id===curG).bounds,{...pad(),duration:.5})};
 const lvl=()=>{const c=panel.classList;return c.contains('max')?2:c.contains('peek')?0:c.contains('min')?0.5:1};
 const syncFold=()=>{const v=lvl();document.getElementById('fup').disabled=v===2;document.getElementById('fdown').disabled=v===0};
 new MutationObserver(syncFold).observe(panel,{attributes:true,attributeFilter:['class']});syncFold();
 document.getElementById('fup').onclick=()=>{const v=lvl();if(v===0.5){clearSel();setSheet('mid')}else setSheet(v===0?'mid':'max')};
 document.getElementById('fdown').onclick=()=>{const v=lvl();setSheet(v===2?'mid':'peek')};
 map.on('click',()=>{lmenu.classList.remove('open');lbtn.setAttribute('aria-expanded','false')});
 document.getElementById('reset').onclick=()=>{clearSel();home()};
}).catch(()=>{document.getElementById('list').innerHTML='<p class="note">The map data did not load. Try reloading the page.</p>'});
addEventListener('resize',()=>map.invalidateSize());
// desktop split
const split=document.getElementById('split'),root=document.documentElement;
const setPw=w=>{w=Math.round(Math.max(300,Math.min(w,innerWidth*0.66)));root.style.setProperty('--pw',w+'px');return w};
try{const w=+localStorage.getItem('dh-pw');if(w)setPw(w)}catch(e){}
let raf=0;const inv=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>map.invalidateSize())};
const savePw=()=>{try{localStorage.setItem('dh-pw',parseInt(getComputedStyle(root).getPropertyValue('--pw'))||400)}catch(e){}};
split.addEventListener('pointerdown',e=>{split.setPointerCapture(e.pointerId);split.classList.add('on');document.body.classList.add('dragging')});
split.addEventListener('pointermove',e=>{if(!split.classList.contains('on'))return;setPw(e.clientX-5);inv()});
const endSplit=()=>{if(!split.classList.contains('on'))return;split.classList.remove('on');document.body.classList.remove('dragging');savePw();map.invalidateSize()};
split.addEventListener('pointerup',endSplit);split.addEventListener('pointercancel',endSplit);
split.addEventListener('dblclick',()=>{setPw(400);savePw();map.invalidateSize()});
split.addEventListener('keydown',e=>{const cw=parseInt(getComputedStyle(root).getPropertyValue('--pw'))||400;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setPw(cw+(e.key==='ArrowLeft'?-30:30));savePw();map.invalidateSize()}});
// phone sheet drag
var dragged=false;
const hnd=document.getElementById('handle');let sy0=null,sh0=0;
hnd.addEventListener('pointerdown',e=>{if(!mob())return;sy0=e.clientY;sh0=panel.offsetHeight;hnd.setPointerCapture(e.pointerId)});
hnd.addEventListener('pointermove',e=>{if(sy0==null)return;const dy=e.clientY-sy0;if(!dragged&&Math.abs(dy)<6)return;
 if(!dragged){dragged=true;if(panel.classList.contains('min'))window.clearSel&&clearSel();['min','max','peek'].forEach(c=>panel.classList.remove(c));panel.classList.add('drag')}
 panel.style.height=Math.max(80,Math.min(sh0-dy,innerHeight*0.92))+'px'});
const endDrag=()=>{if(sy0==null)return;sy0=null;if(!dragged)return;panel.classList.remove('drag');
 if(panel.offsetHeight<140){window.setSheet&&setSheet('peek')}else{setTimeout(()=>window.refocus&&refocus(),50)}
 setTimeout(()=>{dragged=false},350)};
hnd.addEventListener('pointerup',endDrag);hnd.addEventListener('pointercancel',endDrag);
// dark mode
const mb=document.getElementById('mode');
const setMode=d=>{root.classList.toggle('dark',d);mb.setAttribute('aria-pressed',d);mb.setAttribute('aria-label',d?'Light mode':'Dark mode');window._paint&&_paint(d?'dark':'light');try{localStorage.setItem('dh-mode',d?'dark':'light')}catch(e){}};
mb.onclick=()=>setMode(!root.classList.contains('dark'));
try{if(localStorage.getItem('dh-mode')==='dark')setMode(true)}catch(e){}
// full screen
const fsb=document.getElementById('fs');let nativeFs=false;
const setFs=on=>{document.body.classList.toggle('fs',on);fsb.setAttribute('aria-pressed',on);fsb.setAttribute('aria-label',on?'Exit full screen':'Full screen map');fsb.querySelector('span').textContent=on?'Exit':'Full screen';
 setTimeout(()=>window.refocus&&refocus(),60)};
fsb.onclick=()=>{const on=!document.body.classList.contains('fs');setFs(on);
 try{if(on&&root.requestFullscreen&&!document.fullscreenElement){root.requestFullscreen().then(()=>{nativeFs=true}).catch(()=>{})}
  else if(!on&&document.fullscreenElement){document.exitFullscreen().catch(()=>{})}}catch(e){}};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&nativeFs){nativeFs=false;if(document.body.classList.contains('fs'))setFs(false)}});
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('fs')&&!document.fullscreenElement)setFs(false)});
}
</script>
</body>
